[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-analyzer"
dynamic = ["version"]
description = "Desktop chess analysis tool: Stockfish evaluations, move heatmaps and Lichess opening data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antony Parks" }]
keywords = ["chess", "stockfish", "lichess", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.11,<2",
    "pillow>=10",
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[project.scripts]
chess-analyzer = "chess_analyzer.app:main"

[project.urls]
Homepage = "https://github.com/AntonyParks/chess-analyzer"
Issues = "https://github.com/AntonyParks/chess-analyzer/issues"

[tool.setuptools.dynamic]
version = { attr = "chess_analyzer.__version__" }

[tool.setuptools.packages.find]
include = ["chess_analyzer*"]

[tool.setuptools.package-data]
chess_analyzer = ["assets/pieces/*.png", "assets/pieces/*.md", "phone/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["chess_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
